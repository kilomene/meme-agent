name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-tests:
    name: Python test suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: Agent subsystem suite
        run: python -m pytest tests -q
      - name: Manifest freshness check
        run: python3 scripts/gen_manifest.py --check

  worker-contract-tests:
    name: Worker contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --test "worker/tests/*.test.mjs"

  installer:
    name: Installer idempotency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash installer/test_idempotent.sh
