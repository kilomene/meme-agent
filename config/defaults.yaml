# forex-agent — default configuration.
#
# This file holds every NON-SECRET setting. Secrets (WORKER_API_KEY)
# come from environment variables or a 0600 secrets file (see
# FOREX_SECRETS_FILE) — never here, never in code, never in logs.
# (The memecoin provider needs no secrets: the wallet public key is
# public, and the wallet secret must never leave your custody.)
#
# Environment variables override anything in this file. See config.py
# for the full env-var → setting map (original bridge keys preserved).

# dry_run | live
# dry_run is the default and blocks ALL live orders at the execution
# gateway. Switching to live requires deliberately editing this (or
# setting DRY_RUN=false / MODE=live) AND providing broker credentials.
mode: dry_run

broker:
  provider: memecoin  # memecoin | disconnected

# Memecoin provider settings (broker/memecoin/RUNTIME.md). The paper
# engine needs nothing here to run; live mode additionally requires
# MEMECOIN_LIVE_ARMED=true and MEMECOIN_WALLET_PUBKEY (public key only)
# in the environment — and still fails closed until a real execution
# path exists.
memecoin:
  data_dir: ""          # default: $FOREX_AGENT_HOME/data/memecoin
  paper_start_sol: 10.0 # virtual starting balance for fresh paper state
  live_armed: false
  wallet_pubkey: ""     # env MEMECOIN_WALLET_PUBKEY preferred
  symbols:             # SYMBOL: mint pairs — broker registry. NOTE: a coin is only
