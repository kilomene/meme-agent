# Degen launch radar — real-time new-coin detection (pump.fun launches,
# DexScreener boosts on solana/base/ethereum/robinhood, Hyperliquid spot
# listings). Qualified launches get a paper BUY + ALWAYS a Telegram card
# with the CA. Paper-only; kill-switch respected; entries are idempotent
# per mint (never double-enter).
degen:
  enabled: true
  poll_interval_seconds: 15
  entry_sol: 0.05            # fixed paper size per launch
  max_positions: 5           # max concurrent degen paper positions
  min_usd_market_cap: 10000  # early-traction bar for fresh launches
  max_age_minutes: 10        # "early" window for a fresh launch
  velocity_multiplier: 3.0   # mcap x3 within velocity_window -> candidate
  velocity_window_minutes: 10.0
  stop_loss_pct: 30.0        # wide degen stops
  take_profit_pct: 200.0
  max_hold_hours: 4.0
  # Two-tier exits (2026-10-01 backtest: every variant beat single exits,
  # cutting the per-trade bleed ~65-75% on 109 trustworthy paper closes):
  # leg A keeps the exits above; leg B (runner half) skips the fixed TP
  # and holds up to tier_b_max_hold_hours with the same trail. Disable
  # with two_tier_enabled: false to restore single-position behavior.
  two_tier_enabled: true
  tier_b_max_hold_hours: 24.0
  # Proof-of-demand checks (2026-10-02, measurement only): for every
  # scored confirmed runner, record LP-lock, holder-concentration and
  # distribution verdicts into state["proof_checks"]. Nothing gates on
  # them yet — after ~1 week the ledger decides whether any check
  # becomes a real entry/pick gate. Disable with proof_enabled: false.
  proof_enabled: true
  proof_holder_top10_max_pct: 40.0  # fail when top-10 wallets own more
  proof_holder_single_max_pct: 20.0 # fail when one wallet owns more
  proof_dump_sell_ratio: 2.0        # fail when h1 sells >= this x buys
  proof_insider_max_pct: 20.0       # fail when insider cluster owns more
  proof_timeout_s: 8.0              # per-check HTTP budget
  # Footprint signals (2026-10-02, measurement only): for every scored
  # confirmed runner, record holder-velocity (crowd arriving?) and
  # accumulation (volume spiking while price flat?) into
  # state["footprint_signals"], read from the fingerprint time series.
  # Nothing gates on them yet — after ~1 week the ledger decides
  # whether any signal becomes a real entry/pick gate. Disable with
  # footprints_enabled: false.
  footprints_enabled: true
  fp_velocity_crowd_per_min: 1.0  # provisional "crowd" threshold (holders/min)
  fp_velocity_min_window_min: 5.0 # min span between holder observations
  fp_accum_vol_accel: 2.0         # vol spike multiple vs earlier polls
  fp_accum_price_flat_pct: 10.0   # |price change| at/under = "flat"
  auto_enter: true           # paper BUY on confirm (alert always sent either way)
  # --- strict runner confirmation (stage 2) ---
  # A candidate only becomes an alerted runner when ALL of these hold:
  confirm_gain_mult: 1.8            # mcap up >= 1.8x from first sighting
  confirm_rising_polls: 3           # price rising in N consecutive polls
  confirm_min_m5_volume_usd: 3000.0 # real money moving in last 5 minutes
  confirm_min_liquidity_usd: 12000.0
  confirm_min_buys_m5: 5
  confirm_min_buy_sell_ratio: 1.5   # demand, not distribution
  confirm_window_minutes: 30        # drop silently if never confirms
  # --- pre-entry safety gate (rug / honeypot screening) ---
  safety_gate: true              # RugCheck (sol) / GoPlus (base, eth)
  safety_fail_closed: false      # retained for compatibility; the confirm gate
                                 # is now ALWAYS fail-closed on unknown (strict
                                 # 1/100: no score, no CA)
  # --- trailing profit lock ---
  trail_trigger_pct: 50.0        # arm trailing stop once up this much
  trail_drawdown_pct: 30.0       # exit on this pullback from the peak
  # Leg A profit lock (v2 exits, 2026-10-02): the classic half banks
  # profit early — once its peak hits leg_a_trail_trigger_pct, a
  # leg_a_trail_drawdown_pct pullback exits ("profit_lock") instead of
  # round-tripping to the stop. Leg B (runner) keeps the single
  # trail_trigger_pct/trail_drawdown_pct stage only.
  leg_a_trail_trigger_pct: 20.0  # Leg A: arm the profit lock at +20%
  leg_a_trail_drawdown_pct: 15.0 # Leg A: exit on 15% pullback from peak
  # --- risk governor ---
  daily_max_loss_sol: 0.15       # pause new entries past this daily loss
  bundle_max_cluster_pct: 30.0   # deep-scan fail: bundled supply share
  smart_poll_seconds: 60.0       # smart-money wallet poll cadence (Helius); effective poll = max(this, tracked_wallets*12s) so >5 wallets slows the cadence instead of blowing the Helius credit budget
  smart_boost_wallets: 2       # tracked wallets buying -> confirmation boost
  smart_rising_polls: 2        # rising polls needed when boosted
  smart_fasttrack_enabled: true # tracked-wallet buys of brand-new mints -> instant card (still gated by _instant_verdict, still capped)
  smart_grade_dedup_days: 7.0  # same (wallet, mint) buy not re-recorded within this window
  smart_grade_window_days: 30.0 # trailing window for /smartgrade PnL grades
  deployer_tracking_enabled: true # resolve launch creators lazily (cached); hot deployers get a 🏭 line on the card
  deployer_hot_hit_rate: 0.30  # hot deployer: >= min launches AND >= this 2x-hit rate
  deployer_min_launches: 3     # minimum launches before a deployer can be hot
  deployer_resolve_ttl_s: 21600.0 # deployer cache TTL (6h); negative results cached too
  early_safety_flash: true     # flash RugCheck/GoPlus before instant CA
  early_flash_timeout_s: 4.0   # flash check HTTP budget
  early_min_score: 1.0         # quality gate: min safety score (standing bar 1/100, user decision 2026-09-27)
  # --- RugCheck insider gates (Solana): bundled-launch protection ---
  insider_cluster_max_pct: 20.0  # fail if insider clusters hold > this % of supply
  graph_insiders_max: 5          # fail if more insider wallets detected
  # --- EVM sell simulation (Base/Ethereum): Honeypot.is, free ---
  evm_sell_sim_enabled: true     # real buy->sell simulation on top of GoPlus
  evm_sell_sim_timeout_s: 3.0    # per-call HTTP budget for the simulation
  early_alert_max_per_window: 4    # spam guard: instant alerts per window (standing 4/hour, user decision 2026-09-27)
  early_alert_window_seconds: 3600.0
  # --- sniper tier: runner-probability ranking ("monitor wide, alert narrow") ---
  # Quality-passed candidates are scored 0-100 (sniper.py); score >=
  # sniper_tier_threshold alerts instantly (still capped at 4/hour,
  # highest rank first); below threshold joins the digest queue.
  # Nothing is ever silently discarded. Weights are review-tunable;
  # safety gates never self-tune and are untouched by this module.
  sniper_enabled: true
  sniper_tier_threshold: 50.0
  sniper_weight_fp: 30.0
  sniper_weight_smart: 35.0
  sniper_weight_velocity: 20.0
  sniper_weight_pressure: 10.0
  sniper_boost_deployer: 5.0
  # --- narrative-heat boost, idea #5 (user decision 2026-09-28) ---
  # Hot-narrative coins earn up to narrative_boost_max extra sniper
  # points, scaled by (heat - 1.0). Cold narratives never penalize.
  narrative_boost_enabled: true
  narrative_boost_max: 8.0
  # --- feedback loop, idea #6 (user decision 2026-09-28) ---
  # Daily outcome analysis -> tuning PROPOSALS only. Nothing applies
  # without the user's explicit /tune apply; safety gates never tune.
  feedback_enabled: true
  feedback_min_outcomes: 20
  # --- smart-wallet auto-discovery, idea #2 (user decision 2026-10-01) ---
  # Once a day, mine early buyers of past 5x+ runners and store wallet
  # proposals for review. Proposals ONLY — /smartadd is the only path
  # to the tracked registry; nothing auto-adds.
  discovery_enabled: true
  discovery_runner_mult: 5.0
  discovery_early_window_s: 3600
  discovery_min_hits: 2
  discovery_min_hit_rate: 0.5
  discovery_max_runners: 10
  discovery_max_sigs: 30
  discovery_max_new: 5
  discovery_interval_s: 86400
  # --- winner-likeness ranker, idea #5 (user decision 2026-10-01) ---
  # Every confirmed/lowcap runner is scored 0-100 against the bot's own
  # 10x+ history (the score rides on the card). winner_min_score is OFF
  # (0) until the user approves a threshold via /tune — then runners
  # scoring below it are held out of the top tier. Hard safety gates
  # are never affected by this ranker.
  winner_min_score: 0.0
  # --- sustained-velocity tier, idea #4 (user decision 2026-10-01) ---
  # Re-check each confirmed runner sustained_delay_min after its first
  # alert: SUSTAINED earns a louder top-tier card, FADING/DEAD stay
  # silent (logged only, never spam). Uses the milestone peak as the
  # reference — the first alert is never delayed or changed.
  sustained_enabled: true
  sustained_delay_min: 30.0
  sustained_peak_hold_pct: 70.0
  sustained_lookback_min: 15.0
  sustained_max_drawdown_pct: 30.0
  # --- second-wave measurement, idea #3 (user decision 2026-10-01) ---
  # Every published launch.second_wave card is recorded; 24h later the
  # forward multiple (milestone peak / wave-time multiple) settles into
  # a ledger. The daily learner only PROPOSES trigger tweaks after
  # >=10 settled waves prove an edge. Nothing auto-tunes.
  wavefront_enabled: true
  # --- Top Picks shortlist (user decision 2026-10-01) ---
  # Once a day at toppicks_time (WAT), the last 24h of confirmed runners
  # are ranked by composite score and ONE card drops the top
  # toppicks_count — the shortlist to gamble from. Ranking only.
  toppicks_enabled: true
  toppicks_count: 5
  toppicks_time: "08:00"         # WAT slot for the daily picks card
  # Weekly learner review (user decision 2026-09-28): one card every
  # Monday 08:00 WAT summarizing new proposals, applied changes and
  # their grades, and the week's win rate. Informational only.
  # NOT a learning knob — the learner can never reschedule its review.
  review_enabled: true
  review_weekday: 0            # 0=Monday … 6=Sunday (WAT)
  review_time: "08:00"         # WAT slot for the weekly card
  # --- confirmed-runner alert lane (user decision 2026-09-28) ---
  # Chart-confirmed runners (multi-poll proof) drop the CA even when no
  # safety report exists — the chart proof IS the analysis. They carry a
  # prominent UNVETTED label instead of a score. Hard fails (honeypot /
  # can't-sell / high sell tax / insider clusters) still block where a
  # report exists. Unconfirmed coins stay silent as before.
  confirm_unvetted_alerts: true
  # Safety-unknown coins (screen ran, no report — NOT known-bad) join the
  # hourly digest with a prominent UNVETTED label. Never instant alerts,
  # never paper entries. Hard fails, safety errors, below-bar scores stay
  # held silently. User decision 2026-09-28; not a learning knob.
  digest_include_unknown_safety: true
  # Early-digest pause switch (user decision 2026-10-02): the hourly
  # digest was batching ~1,300 early/unvetted coins a day into 70+
  # Telegram cards — a firehose nobody reads. Paused: the queue is
  # dropped silently at flush time (milestone tracking already ran at
  # enqueue, so runners-recap coverage is preserved). Confirmed
  # runners, warnings, recaps, and Top Picks are untouched. Planned
  # return: a rebuilt digest showing ONLY coins passing the 3
  # proof-of-demand checks, once their measurement week concludes.
  early_digest_enabled: false
  # --- runners recap (user decision 2026-09-28) ---
  # Twice-daily card listing only the coins that actually ran (>=
  # recap_min_mult from their card-time anchor) since the last recap.
  # Informational only: never trades, never gates. Times are WAT
  # (Africa/Lagos, UTC+1, no DST).
  recap_enabled: true
  recap_times: ["08:00", "20:00"]
  recap_min_mult: 2.0
  recap_max_items: 20
  milestone_max_tracked: 1000  # milestone watch holds this many recent carded coins (~a full day); the runners recap needs the whole day, not just the last 120
  # --- low-cap runner hunter: catch runners at low mcap, pre-viral ---
  lowcap_enabled: true           # alert-only tripwire, never a paper entry
  lowcap_mcap_ceiling_usd: 500000.0  # only coins at/below this mcap
  lowcap_min_run_pct: 50.0       # CA drops only inside this running band...
  lowcap_max_run_pct: 150.0      # ...above it the coin already went viral
  lowcap_rising_polls: 2         # consecutive rising polls needed
  lowcap_min_m5_volume_usd: 2000.0
  lowcap_min_liquidity_usd: 8000.0
  lowcap_min_buys_m5: 4
  lowcap_min_buy_sell_ratio: 1.3
  lowcap_window_minutes: 45      # tracking window per coin
  lowcap_fp_boost_enabled: true  # HOT fingerprints count as 1 rising poll
  # --- early fingerprints: buy/volume acceleration + holder growth ---
  fp_enabled: true               # fingerprint tracker on/off
  fp_window_polls: 6             # per-mint observation window
  fp_min_polls: 3                # polls before a score is produced
  fp_buy_floor: 3.0              # accel denominator floor (buys)
  fp_vol_floor_usd: 1000.0       # accel denominator floor (5m vol usd)
  fp_hot_score: 70.0             # composite >= this -> HOT
  fp_warm_score: 45.0            # composite >= this -> WARMING
  fp_holder_refresh_s: 600       # min seconds between holder refreshes
  fp_holder_per_cycle: 3         # max fresh holder lookups per cycle
  logstream_enabled: true      # sub-second program-log detection thread
  usdc_pools_enabled: true     # USDC-quoted new pools (GeckoTerminal, ~1/min)
  # --- established-coin momentum scanner (trending pools) ---
  momentum_enabled: true         # scan GeckoTerminal trending pools for runners
  momentum_scan_seconds: 300     # poll interval (~5 min)
  momentum_networks:             # gecko networks scanned for trending runners
    - solana
    - base
    - eth
  momentum_min_gain_24h: 20.0    # 24h gain floor % (must be running)
  momentum_max_gain_24h: 300.0   # 24h gain ceiling % (anti-top-buying guard)
  momentum_max_drawdown_1h: 15.0 # 1h change must not be worse than -this %
  momentum_min_vol_24h_usd: 100000.0  # 24h volume floor (real trading)
  momentum_min_liq_usd: 50000.0       # liquidity floor (can exit)
  momentum_cooldown_hours: 6.0   # per-pool alert cooldown
  momentum_lowcap_max_mcap_usd: 10000000.0  # lowcap lane ceiling: mcap at/below -> "lowcap" lane, above/unknown -> "established" lane
  momentum_lowcap_min_mcap_usd: 50000.0     # lowcap lane floor: known mcap at/below -> excluded entirely (dust zone, no alert)
  shadow_enabled: true              # shadow ledger: paper-simulate blocked runners (measurement only, never trades)
  shadow_max_open: 20               # max concurrent shadow positions
  shadow_stop_pct: 30.0             # shadow stop-loss: close at -30% from hold-time mcap
  shadow_tp_pct: 200.0              # shadow take-profit: close at +200% from hold-time mcap
  shadow_max_hold_hours: 24.0       # shadow timeout: close whatever remains after 24h
  shadow_pending_timeout_minutes: 60.0  # shadow pending: drop first-sight holds that never get a price after 60m (no-data, not a loss)
  warn_enabled: true              # early-warning lane: UNCONFIRMED alerts for held-but-moving coins (main 1/100 stream untouched)
  warn_min_score: 1.0             # warning floor: known score >= 1 (unknown/unscored stay silent)
  warn_max_per_hour: 4            # global rate limit for the warning lane
  warn_cooldown_hours: 0.5       # per-coin warning cooldown (0.5h = 30 minutes)
  warn_min_buys_m5: 20.0          # launch door: first-sight momentum needs >= 20 buys/5m
  warn_min_vol_m5_usd: 5000.0     # launch door: ... and >= $5k vol/5m
  insider_track_enabled: true     # insider behavior tracker: snapshot + trend insider supply share
  insider_watch_max: 40           # max mints on the insider watchlist
  insider_refresh_minutes: 15.0   # re-check insider footprint this often
  insider_fast_minutes: 5.0       # fast-start: newly watched mints refresh this often ...
  insider_fast_window_minutes: 60.0  # ... for this long after first watch, then back to normal
  insider_ledger_max: 200         # cap of insider-outcome rows kept (Phase 1 evidence)
  logstream_rpc_urls:          # failover pool for tx fetches (first healthy wins)
    - https://api.mainnet-beta.solana.com
    - https://solana.public-rpc.com
    - https://rpc.ankr.com/solana
  # --- social sentiment tracker (keyless DexScreener profile velocity) ---
  sentiment_enabled: true      # sentiment tracker on/off (soft boost only)
  sentiment_per_cycle: 2       # max fresh profile fetches per judge cycle
  # --- AI narrative picker + heat tracker (soft signal only) ---
  narrative_enabled: true      # narrative classification + heat on/off
  # --- backtesting engine: closed candidates -> JSONL dataset ---
  backtest_enabled: true       # dataset recorder on/off
  backtest_dataset_path: ~/.forex-agent/launch_scanner/backtest_dataset.jsonl
  # --- entry-timing latency (measurement only) ---
  latency_enabled: true            # entry-timing tracker on/off (measurement only: never trades, never gates)
  latency_window_coins: 100        # rolling window of the last N carded coins for median/p90 latency
  # --- second-wave re-entry ---
  second_wave_enabled: true        # re-entry tracking on/off (card + paper entry on pullback->re-acceleration)
  second_wave_pullback_pct: 40.0   # pullback >= this % from the peak multiple marks the trough
  second_wave_releg_gain_pct: 50.0 # re-acceleration >= this % from the trough confirms the wave
  second_wave_reentry_window_min: 45.0  # trough older than this never fires (stale)
  second_wave_cooldown_hours: 6.0  # one second-wave card per coin per this many hours (independent of the main duplicate-card cooldown)
  # --- slow-cooker late runners (ACTIONABLE: card + paper entry on a late 2x) ---
  slow_cooker_enabled: true        # late-runner watch on/off (reuses the milestone watch records; never builds its own pool)
  slow_cooker_window_hours: 3.0    # watch carded-but-quiet coins this long past their card for a late 2x
  slow_cooker_trigger_pct: 100.0   # late-runner trigger: gain >= this % from the card-time anchor (100 = 2x)

performance:
  enabled: true
  interval_hours: 6.0
  lookback_days: 30

kill_switch:
  check_interval_seconds: 10

events:
  enabled: true
  queue_max: 1000

notifications:
  enabled: false
  # Dispatcher loop: how often to check the delivery journal for new events.
  poll_interval_seconds: 5.0
  # HTTP timeout (seconds) for worker / fcm / webhook delivery.
  timeout_seconds: 5.0
  # Bounded retries for NOTIFICATION delivery only (2 attempts = 1 retry).
  # The dispatcher never touches trade execution — there is no execution
  # path here to retry.
  max_attempts: 2
  backoff_seconds: 1.0
  # Per-channel enable flags. The agent channel (localhost SSE journal) is
  # the PRIMARY path and is always available; the rest are optional sinks.
  channels:
    agent: true
    worker: true
    fcm: false
    webhook: false
    telegram: false
  # Telegram (optional). The bot token is a secret: it comes from the
  # TELEGRAM_BOT_TOKEN env var ONLY and must never be written in yaml.
  # Target chat: TELEGRAM_CHAT_ID env var (preferred) or telegram_chat_id.
  telegram_chat_id: ""
  # Webhook POST target. Prefer the NOTIFY_WEBHOOK_URL env var — the URL
  # may embed a token, and secrets never belong in yaml.
  webhook_url: ""
  # FCM (mobile push, worker-mediated, optional/legacy). Project id comes
  # from the FCM_PROJECT_ID env var when set.
  fcm_project_id: ""
  # Worker push endpoint path for FCM, e.g. "/notify". Empty = the Worker
  # contract defines no per-event push endpoint yet (see
  # worker/CONTRACT.md), so the FCM channel honestly reports unconfigured
  # until this is set.
  fcm_push_path: ""
  # Severity -> channels. CRITICAL reaches every configured channel;
  # INFO stays on the agent channel only.
  routing:
    CRITICAL: [agent, worker, fcm, webhook, telegram]
    WARNING: [agent, worker, telegram]
    NOTICE: [agent, worker, telegram]
    INFO: [agent]

logging:
  level: INFO
  format: json  # json | text

charts:
  symbols: []  # empty = trading symbols
  timeframes:
    - M15
    - H1
    - H4
    - D1
  candle_count: 150
  update_interval_seconds: 120

scan_interval_seconds: 60
reconciliation_interval_seconds: 300
