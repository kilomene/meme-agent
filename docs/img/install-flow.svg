<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="sans-serif">
  <defs>
    <style>
      .step { fill:#f8fafc; stroke:#334155; stroke-width:1.5 }
      .step-t { font-size:13px; font-weight:bold; fill:#0f172a }
      .step-d { font-size:11.5px; fill:#475569 }
      .arrow { stroke:#64748b; stroke-width:2; fill:none; marker-end:url(#ah2) }
      .cmd { font-family:monospace; font-size:11px; fill:#0f172a }
    </style>
    <marker id="ah2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/>
    </marker>
  </defs>

  <text x="450" y="24" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">Install flow — what your agent runs</text>

  <!-- Step 1 -->
  <rect class="step" x="20" y="60" width="190" height="150" rx="10"/>
  <text class="step-t" x="35" y="86">1. Clone</text>
  <text class="cmd" x="35" y="110">git clone</text>
  <text class="step-d" x="35" y="132">github.com/kilomene/</text>
  <text class="step-d" x="35" y="150">Forex-agent</text>

  <!-- Step 2 -->
  <rect class="step" x="245" y="60" width="190" height="150" rx="10"/>
  <text class="step-t" x="260" y="86">2. Install</text>
  <text class="cmd" x="260" y="110">./installer/install.sh</text>
  <text class="cmd" x="260" y="128">  --agent --non-interactive</text>
  <text class="step-d" x="260" y="152">Checks Python ≥ 3.12, creates</text>
  <text class="step-d" x="260" y="170">~/.forex-agent, writes</text>
  <text class="step-d" x="260" y="188">secrets.env (0600), smoke-tests</text>

  <!-- Step 3 -->
  <rect class="step" x="470" y="60" width="190" height="150" rx="10"/>
  <text class="step-t" x="485" y="86">3. Daemons</text>
  <text class="cmd" x="485" y="110">./scripts/forex-daemons</text>
  <text class="cmd" x="485" y="128">  start</text>
  <text class="step-d" x="485" y="152">market · signal · position</text>
  <text class="step-d" x="485" y="170">· health monitors +</text>
  <text class="step-d" x="485" y="188">supervisor</text>

  <!-- Step 4 -->
  <rect class="step" x="695" y="60" width="185" height="150" rx="10"/>
  <text class="step-t" x="710" y="86">4. Verify</text>
  <text class="cmd" x="710" y="110">cat ~/.forex-agent/</text>
  <text class="cmd" x="710" y="128">  install-result.json</text>
  <text class="step-d" x="710" y="152">Real probes → status:</text>
  <text class="step-d" x="710" y="170">installed / configured /</text>
  <text class="step-d" x="710" y="188">operational / …</text>

  <line class="arrow" x1="210" y1="135" x2="242" y2="135"/>
  <line class="arrow" x1="435" y1="135" x2="467" y2="135"/>
  <line class="arrow" x1="660" y1="135" x2="692" y2="135"/>

  <text x="450" y="250" text-anchor="middle" font-size="12" fill="#475569">Idempotent — safe to re-run; repairs instead of duplicating, never overwrites secrets</text>
  <text x="450" y="272" text-anchor="middle" font-size="12" fill="#475569">Defaults to <tspan font-weight="bold">dry-run mode</tspan>: nothing trades live until you explicitly enable it</text>
</svg>
