<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" font-family="sans-serif">
  <defs>
    <style>
      .node { fill:#f8fafc; stroke:#334155; stroke-width:1.5 }
      .node-t { font-size:12.5px; font-weight:bold; fill:#0f172a }
      .node-d { font-size:11px; fill:#475569 }
      .arrow { stroke:#64748b; stroke-width:2; fill:none; marker-end:url(#ah3) }
      .side { stroke-dasharray:5,4 }
    </style>
    <marker id="ah3" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/>
    </marker>
  </defs>

  <text x="450" y="24" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">Signal lifecycle — detection to journal</text>

  <!-- main pipeline -->
  <rect class="node" x="10" y="70" width="130" height="70" rx="10"/>
  <text class="node-t" x="22" y="94">Market data</text>
  <text class="node-d" x="22" y="114">DexScreener/GeckoTerminal</text>
  <text class="node-d" x="22" y="130">symbols</text>

  <rect class="node" x="165" y="70" width="140" height="70" rx="10"/>
  <text class="node-t" x="177" y="94">Signal engine</text>
  <text class="node-d" x="177" y="114">RSI · ATR · SMC ·</text>
  <text class="node-d" x="177" y="130">multi-timeframe</text>

  <rect class="node" x="330" y="70" width="140" height="70" rx="10"/>
  <text class="node-t" x="342" y="94">Risk gates</text>
  <text class="node-d" x="342" y="114">daily-loss · spread ·</text>
  <text class="node-d" x="342" y="130">max positions · kill switch</text>

  <rect class="node" x="495" y="70" width="150" height="70" rx="10"/>
  <text class="node-t" x="507" y="94">Execution gateway</text>
  <text class="node-d" x="507" y="114">dry-run default · broker-</text>
  <text class="node-d" x="507" y="130">confirmed · idempotent</text>

  <rect class="node" x="670" y="70" width="130" height="70" rx="10"/>
  <text class="node-t" x="682" y="94">Trade journal</text>
  <text class="node-d" x="682" y="114">signal → decision →</text>
  <text class="node-d" x="682" y="130">fill → close, timestamped</text>

  <rect class="node" x="825" y="70" width="65" height="70" rx="10"/>
  <text class="node-t" x="835" y="94">Memecoin</text>
  <text class="node-d" x="835" y="114">paper broker</text>

  <line class="arrow" x1="140" y1="105" x2="162" y2="105"/>
  <line class="arrow" x1="305" y1="105" x2="327" y2="105"/>
  <line class="arrow" x1="470" y1="105" x2="492" y2="105"/>
  <line class="arrow" x1="645" y1="105" x2="667" y2="105"/>
  <line class="arrow" x1="800" y1="105" x2="822" y2="105"/>

  <!-- side outputs -->
  <rect class="node" x="165" y="170" width="140" height="60" rx="10"/>
  <text class="node-t" x="177" y="192">🔔 Telegram</text>
  <text class="node-d" x="177" y="212">signal_bridge.py → alerts</text>

  <rect class="node" x="495" y="170" width="150" height="60" rx="10"/>
  <text class="node-t" x="507" y="192">Agent events</text>
  <text class="node-d" x="507" y="212">SSE channel · notifications</text>

  <line class="arrow side" x1="235" y1="140" x2="235" y2="167"/>
  <line class="arrow side" x1="570" y1="140" x2="570" y2="167"/>
</svg>
