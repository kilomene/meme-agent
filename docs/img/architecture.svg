<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" font-family="sans-serif">
  <defs>
    <style>
      .box { fill:#f8fafc; stroke:#334155; stroke-width:1.5; rx:10 }
      .layer-title { font-size:13px; font-weight:bold; fill:#0f172a }
      .item { font-size:12px; fill:#334155 }
      .arrow { stroke:#64748b; stroke-width:2; fill:none; marker-end:url(#ah) }
      .lbl { font-size:11px; fill:#64748b }
    </style>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/>
    </marker>
  </defs>

  <text x="450" y="24" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">Forex Agent — System Architecture</text>

  <!-- Interfaces -->
  <rect class="box" x="20" y="50" width="860" height="80" rx="10"/>
  <text class="layer-title" x="40" y="72">Agent interfaces</text>
  <text class="item" x="40" y="94">MCP server (stdio JSON-RPC) · CLI (scripts/forex) · Local HTTP API (loopback) · SSE event channel · Telegram</text>
  <text class="item" x="40" y="112">Machine contract: agent/capabilities.json · Notifications: agent/notifications</text>

  <!-- Core -->
  <rect class="box" x="20" y="150" width="420" height="110" rx="10"/>
  <text class="layer-title" x="40" y="172">Deterministic core</text>
  <text class="item" x="40" y="194">core/signals · core/strategies · core/indicators</text>
  <text class="item" x="40" y="214">backtesting/ · intelligence/ (correlation, calendar)</text>
  <text class="item" x="40" y="234">Every signal carries its inputs — no black boxes</text>

  <rect class="box" x="460" y="150" width="420" height="110" rx="10"/>
  <text class="layer-title" x="480" y="172">Risk engine + execution gateway</text>
  <text class="item" x="480" y="194">core/risk · core/execution (dry-run default)</text>
  <text class="item" x="480" y="214">Daily-loss limit · per-trade risk · spread guard</text>
  <text class="item" x="480" y="234">Kill switch sits BELOW the agent layer</text>

  <!-- Broker -->
  <rect class="box" x="20" y="280" width="420" height="100" rx="10"/>
  <text class="layer-title" x="40" y="302">Broker adapters</text>
  <text class="item" x="40" y="324">broker/memecoin (paper engine) · broker/disconnected (analysis)</text>
  <text class="item" x="40" y="344">Broker-confirmed execution only · idempotent</text>
  <text class="item" x="40" y="362">live mode fails closed until real execution exists</text>

  <rect class="box" x="460" y="280" width="420" height="100" rx="10"/>
  <text class="layer-title" x="480" y="302">Daemons + cloud</text>
  <text class="item" x="480" y="324">daemon/: market · signal · position · health + supervisor</text>
  <text class="item" x="480" y="344">storage/: journal + persisted state</text>
  <text class="item" x="480" y="362">worker/: Cloudflare Worker + D1 (off-host sync)</text>

  <!-- Arrows -->
  <line class="arrow" x1="450" y1="90" x2="450" y2="146"/>
  <line class="arrow" x1="240" y1="260" x2="660" y2="260"/>
  <line class="arrow" x1="230" y1="260" x2="230" y2="276"/>
  <line class="arrow" x1="670" y1="260" x2="670" y2="276"/>
  <text class="lbl" x="455" y="140">drives</text>
  <text class="lbl" x="350" y="256">signals → risk gates → orders</text>

  <text x="450" y="408" text-anchor="middle" font-size="11" fill="#94a3b8">Secrets are environment-only (secrets.env, mode 0600) — never in the repo</text>
</svg>
